
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Book List (PostgreSQL ORDBMS)</h2>
    <a th:href="@{/ui/books/new}" class="btn btn-primary mb-3">Add New Book</a>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Categories (Array)</th>
                <th>Publisher (JSONB)</th>
                <th>Pages (JSONB)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>
                <td th:text="${book.title}">Title</td>
                <td th:text="${book.categories}">[Category]</td>
                <td th:text="${book.metadata?.publisher}">Publisher</td>
                <td th:text="${book.metadata?.pages}">0</td>
                <td>
                    <a th:href="@{/ui/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{/ui/books/delete/{id}(id=${book.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this book?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
