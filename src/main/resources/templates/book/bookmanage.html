<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2 th:text="${book.id == null ? 'Add New Book' : 'Edit Book'}">Book Form</h2>

<form th:action="@{/ui/books/save}" th:object="${book}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">Title:</label>
        <input type="text" th:field="*{title}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Categories (comma-separated):</label>
        <input type="text" th:field="*{categories}" class="form-control" placeholder="Java, Programming" />
    </div>

    <div class="mb-3">
        <label class="form-label">Publisher (JSONB field):</label>
        <input type="text" th:field="*{metadata.publisher}" class="form-control" />
    </div>

    <div class="mb-3">
        <label class="form-label">Pages (JSONB field):</label>
        <input type="number" th:field="*{metadata.pages}" class="form-control" />
    </div>

    <button type="submit" class="btn btn-success">Save Book</button>
    <a th:href="@{/ui/books}" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
